<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="K書吧">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#EDEFEB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121519" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>K書吧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#EDEFEB; --surface:#F7F8F5; --raised:#FFFFFF; --ink:#1C2126; --muted:#5B6570; --faint:#8A939B; --line:#D6DAD3;
  --accent:#2D4E7E; --accent-ink:#FFFFFF; --accent-soft:#DAE3F0; --danger:#A5382C; --ok:#3B7F57; --warn:#A87617;
  --scrim:rgba(12,16,22,.42);
  --shadow:0 1px 2px rgba(20,28,40,.08),0 10px 28px -14px rgba(20,28,40,.35);
  --f-display:'Noto Serif TC','Source Han Serif TC','PMingLiU',serif;
  --f-ui:'Noto Sans TC','Microsoft JhengHei','PingFang TC',system-ui,sans-serif;
  --f-mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
  --fs:20px; --lh:1.9; --font:var(--f-display); --measure:38em;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121519; --surface:#171B20; --raised:#1E2329; --ink:#DADFE5; --muted:#96A0AA; --faint:#6C767F; --line:#2B3139;
    --accent:#94AEDB; --accent-ink:#0D1320; --accent-soft:#223148; --danger:#E27B6E; --ok:#6CC08F; --warn:#E0B055;
    --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121519; --surface:#171B20; --raised:#1E2329; --ink:#DADFE5; --muted:#96A0AA; --faint:#6C767F; --line:#2B3139;
  --accent:#94AEDB; --accent-ink:#0D1320; --accent-soft:#223148; --danger:#E27B6E; --ok:#6CC08F; --warn:#E0B055;
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
/* 閱讀底色：只在閱讀畫面生效 */
body[data-rtheme="paper"]{color-scheme:light;--bg:#FAFAF7;--surface:#F3F3EF;--raised:#FFFFFF;--ink:#23272B;--muted:#686F76;--faint:#9AA0A5;--line:#E2E2DC;--accent:#2D4E7E;--accent-ink:#fff;--accent-soft:#DDE5F1;--scrim:rgba(12,16,22,.4)}
body[data-rtheme="sepia"]{color-scheme:light;--bg:#F2E8D5;--surface:#EADFC9;--raised:#FAF4E6;--ink:#3A2F22;--muted:#78674F;--faint:#A08F76;--line:#DCCDB0;--accent:#6E4A26;--accent-ink:#FFF8EC;--accent-soft:#E6D5B5;--scrim:rgba(40,28,12,.4)}
body[data-rtheme="green"]{color-scheme:light;--bg:#D9E7D3;--surface:#CFDFC8;--raised:#E8F1E3;--ink:#22301F;--muted:#55644E;--faint:#7F8E77;--line:#BFD1B6;--accent:#2E5B3A;--accent-ink:#F2FAEE;--accent-soft:#C3D9BA;--scrim:rgba(15,30,15,.4)}
body[data-rtheme="night"]{color-scheme:dark;--bg:#0F1113;--surface:#15181B;--raised:#1B1F23;--ink:#B7BEC6;--muted:#7C858E;--faint:#5A626A;--line:#252A30;--accent:#8EA6CF;--accent-ink:#0B1018;--accent-soft:#1E2A3D;--scrim:rgba(0,0,0,.6)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{display:block}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--raised);font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:18px;height:18px}
.icon{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:10px;border:0;background:transparent}
.icon:hover{background:var(--surface)}
.icon svg{width:22px;height:22px}
.icon.on{color:var(--accent);background:var(--accent-soft)}
.icon.aa{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-.02em}
.icon:disabled{opacity:.3;cursor:default}
.icon:disabled:hover{background:transparent}
/* 頂端列有七個鈕，窄手機上縮一點才擠得下書名 */
@media (max-width:420px){.rbar .icon{width:38px}.rbar .icon svg{width:21px;height:21px}}

/* ───── 書架 ───── */
.wrap{max-width:1080px;margin-inline:auto;padding-inline:16px}
@media (min-width:700px){.wrap{padding-inline:28px}}
.lib-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px;padding-block:28px 6px}
.wordmark{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(32px,6vw,44px);letter-spacing:.12em;line-height:1}
.lib-sub{margin:10px 0 0;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.lib-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
button.chip:hover{border-color:var(--faint)}
.chip[data-mode="gh"] i{background:var(--ok)}
.chip[data-mode="readonly"] i,.chip[data-mode="setup"] i{background:var(--warn)}
.chip[data-mode="error"] i{background:var(--danger)}

.continue{margin-top:22px}
.continue-card{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:16px;width:100%;padding:14px 16px;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.continue-card:hover{border-color:var(--faint)}
.continue-card .cover{width:62px}
.eyebrow{display:block;font-size:11.5px;letter-spacing:.14em;color:var(--accent);font-weight:500}
.continue-card h2{margin:4px 0 2px;font-family:var(--f-display);font-size:19px;font-weight:600;text-wrap:balance}
.continue-card p{margin:0 0 9px;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.continue-card .go{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.continue-card .go svg{width:20px;height:20px}
.dev-list{display:grid;gap:6px;margin-top:8px}
.dev-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;padding:10px 14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dev-row:hover{border-color:var(--faint)}
.dev-row b{color:var(--ink);font-weight:600;white-space:nowrap}
.dev-row .t{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dev-row .chev{color:var(--faint)}
.slot-list{margin-top:14px;max-height:min(60vh,520px);overflow-y:auto;padding-right:2px}
.slot-row{display:grid;gap:3px;width:100%;padding:10px 14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot-row:hover{border-color:var(--faint)}
.slot-row .t{color:var(--ink);font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.slot-row b{color:var(--ink);font-weight:500}
.slot-row.mine b{color:var(--accent)}
.bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}

.shelf-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 16px}
.shelf-head h2{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.18em}
.shelf-tools{display:flex;align-items:center;gap:8px;min-width:0}
.view-btn{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--raised);color:var(--muted)}
.view-btn:hover{border-color:var(--faint);color:var(--ink)}
.view-btn svg{width:18px;height:18px}
.tag-bar{display:flex;gap:8px;margin:-6px 0 18px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tag-bar::-webkit-scrollbar{display:none}
.tag-bar .chip{flex:none;cursor:pointer;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.tag-bar .chip b{font-weight:500;color:var(--faint)}
.tag-bar .chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.tag-bar .chip[aria-pressed="true"] b{color:var(--accent)}
select{height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--raised);font-size:13.5px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:30px 18px;padding-bottom:64px}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:34px 26px}}
.book{display:flex;flex-direction:column;gap:10px;min-width:0}
.cover-btn{padding:0;border:0;background:none;border-radius:4px}
.cover{--c:#2D4E7E;--thread:rgba(242,236,222,.8);position:relative;aspect-ratio:2/3;width:100%;max-width:100%;border-radius:2px 5px 5px 2px;container-type:inline-size;overflow:hidden;
  background:
    linear-gradient(90deg,rgba(0,0,0,.24) 0 8%,rgba(255,255,255,.09) 8% 8.8%,transparent 8.8%),
    repeating-linear-gradient(135deg,rgba(255,255,255,.028) 0 2px,transparent 2px 5px),
    var(--c);
  box-shadow:0 1px 1px rgba(0,0,0,.2),0 12px 20px -12px rgba(0,0,0,.55);transition:transform .2s ease}
.cover::before{content:"";position:absolute;left:0;width:8%;top:9%;height:84%;background:linear-gradient(to bottom,var(--thread) 0 1.5px,transparent 1.5px) 0 0/100% 25%}
.cover-btn:hover .cover{transform:translateY(-3px)}
/* 書名條寬度跟著行數長：固定寬時長書名折成兩三行會溢出框外。靠右對齊往左長，最寬到封面 70% */
.slip{position:absolute;top:7%;right:11%;min-width:28%;max-width:70%;box-sizing:border-box;max-height:64%;padding:7cqw 8cqw;background:#F3EEE2;color:#24211D;
  box-shadow:inset 0 0 0 2.5cqw #F3EEE2,inset 0 0 0 calc(2.5cqw + 1px) rgba(36,33,29,.4);
  writing-mode:vertical-rl;font-family:var(--f-display);font-weight:600;font-size:10.5cqw;line-height:1.15;letter-spacing:.06em;overflow:hidden;display:flex;align-items:center}
.cover .auth{position:absolute;left:17%;bottom:7%;writing-mode:vertical-rl;font-family:var(--f-display);font-size:7cqw;letter-spacing:.1em;color:rgba(255,255,255,.72);max-height:40%;overflow:hidden}
.cover .tag{position:absolute;left:17%;top:7%;font-size:7cqw;letter-spacing:.2em;color:rgba(255,255,255,.72);writing-mode:vertical-rl;max-height:42%;overflow:hidden}
.book-title{margin:0;font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.book-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;margin-top:-4px}
.book-meta .more{width:30px;height:30px;margin-right:-6px;border-radius:8px}
.book-meta .more svg{width:18px;height:18px}
.book .pct{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.book .pct .bar{flex:1}
.book .last{margin-top:-4px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
/* 清單模式：每本一列。左邊縮小版書封（只留顏色、書脊、標籤）、中間書名／字數／進度、右邊「⋯」；整列（除了「⋯」）都是開書的按鈕 */
.grid.list{grid-template-columns:1fr;gap:8px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px;padding:10px 6px 10px 12px;background:var(--raised);border:1px solid var(--line);border-radius:12px}
.brow:hover{border-color:var(--faint)}
.brow-main{display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;gap:14px;min-width:0;padding:2px 0;border:0;background:none;text-align:left;border-radius:8px;color:inherit}
.brow .cover{width:40px;max-width:40px;flex:none;box-shadow:0 1px 1px rgba(0,0,0,.2),0 6px 10px -7px rgba(0,0,0,.55)}
.brow .cover .tag{left:26%;top:9%;font-size:8.5px;letter-spacing:.12em;max-height:78%}
.brow-body{min-width:0;display:grid;gap:3px}
.brow .book-title{text-wrap:pretty}
.brow-meta{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.brow-prog{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.brow-prog .bar{flex:1;max-width:180px}
.brow-prog span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.brow .more{width:36px;height:36px;border-radius:8px}
.brow .more svg{width:18px;height:18px}
/* 沒有「⋯」的列（說明書、唯讀）右邊補一樣的寬度，書名才會對齊 */
.brow .more-gap{width:36px;height:36px}
.empty{grid-column:1/-1;margin:0;padding:22px;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;line-height:1.8}
.ver{margin:40px 0 calc(28px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;line-height:2;color:var(--faint);font-variant-numeric:tabular-nums}
.ver button,.ver a{padding:0 2px;color:inherit;font:inherit;text-decoration:underline;text-underline-offset:3px}
.ver .new{color:var(--accent);font-weight:600}
.ver .new a,.ver .new button{color:var(--accent)}
.drop-hint{position:fixed;inset:12px;z-index:80;border:2px dashed var(--accent);border-radius:16px;background:color-mix(in srgb,var(--bg) 88%,transparent);display:grid;place-items:center;font-family:var(--f-display);font-size:22px;color:var(--accent);pointer-events:none}

/* ───── 閱讀 ───── */
.rbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:2px;padding:calc(env(safe-area-inset-top,0px) + 6px) 8px 6px;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:transform .25s ease}
.rtitle{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding-inline:6px;line-height:1.3}
.rtitle b,.rtitle span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtitle b{font-family:var(--f-display);font-weight:600;font-size:14.5px}
.rtitle span{font-size:12px;color:var(--muted)}
.rprog{position:fixed;top:0;left:0;right:0;height:2px;z-index:21;pointer-events:none}
.rprog i{display:block;height:100%;width:0;background:var(--accent);opacity:.8}
.rmain{padding-top:calc(76px + env(safe-area-inset-top,0px));padding-bottom:64px;padding-inline:20px}
@media (min-width:700px){.rmain{padding-inline:40px}}
#reader.with-player .rmain{padding-bottom:230px}
.article{max-width:var(--measure);margin-inline:auto;font-family:var(--font);font-size:var(--fs);line-height:var(--lh);letter-spacing:.02em;text-align:justify;overflow-wrap:break-word}
.article p{margin:0 0 .85em}
.indent .article p{text-indent:2em}
.article li p,.article blockquote p{text-indent:0}
.article h1,.article h2,.article h3,.article h4{font-family:var(--font);line-height:1.45;text-wrap:balance;text-align:left;letter-spacing:.05em;margin:1.6em 0 .8em}
.article h1{font-size:1.5em}
.article h2{font-size:1.32em}
.article h3{font-size:1.14em}
.article > h1:first-child,.article > h2:first-child,.article > h3:first-child{text-align:center;margin:.8em 0 1.8em;font-size:1.42em;font-weight:700}
.article > h1:first-child::after,.article > h2:first-child::after,.article > h3:first-child::after{content:"";display:block;width:2.2em;height:1px;margin:.9em auto 0;background:var(--faint)}
.article blockquote{margin:1em 0;padding:.1em 0 .1em 1em;border-left:3px solid var(--line);color:var(--muted)}
.article ul,.article ol{padding-left:1.6em;margin:0 0 .85em}
.article li{margin:.2em 0}
.article hr{border:0;margin:2em 0;text-align:center;height:auto}
.article hr::after{content:"＊　＊　＊";color:var(--faint);font-size:.9em}
.article pre{overflow-x:auto;font-family:var(--f-mono);font-size:.78em;line-height:1.6;background:var(--surface);border:1px solid var(--line);padding:.8em 1em;border-radius:8px;text-align:left;white-space:pre}
.article code{font-family:var(--f-mono);font-size:.85em;background:var(--surface);padding:.1em .3em;border-radius:4px}
.article pre code{background:none;padding:0;font-size:1em}
.article img{max-width:100%;height:auto}
.article table{display:block;overflow-x:auto;border-collapse:collapse;font-size:.9em;margin:1em 0}
.article td,.article th{border:1px solid var(--line);padding:.35em .6em}
.article a{color:var(--accent)}
.article .speaking{background:var(--accent-soft);box-shadow:0 0 0 .28em var(--accent-soft);border-radius:3px}
.article .loading,.article .err{text-align:center;color:var(--muted);text-indent:0;margin-top:30vh}
.chnav{max-width:var(--measure);margin:3.2em auto 0;padding-top:1.4em;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* 目錄抽屜 */
.scrim{position:fixed;inset:0;z-index:35;background:var(--scrim)}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:40;width:min(88vw,380px);display:flex;flex-direction:column;background:var(--raised);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slideL .22s ease}
.drawer-head{display:flex;align-items:center;gap:10px;padding:14px 8px 12px 20px;border-bottom:1px solid var(--line)}
.drawer-head b{font-family:var(--f-display);font-size:17px;letter-spacing:.15em}
.drawer-head span{flex:1;color:var(--muted);font-size:12.5px}
.toc{list-style:none;margin:0;padding:6px 0 20px;overflow-y:auto;flex:1}
.toc button{display:flex;gap:12px;width:100%;padding:11px 20px;border:0;background:none;text-align:left;font-size:14.5px;line-height:1.45}
.toc button:hover{background:var(--surface)}
.toc .n{flex:none;width:2.4em;color:var(--faint);font-variant-numeric:tabular-nums;text-align:right}
.toc .cur button{color:var(--accent);font-weight:600;background:var(--accent-soft)}
.toc .cur .n{color:var(--accent)}

/* 設定面板 */
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:40;width:min(100%,520px);max-height:85vh;overflow-y:auto;background:var(--raised);border-radius:16px 16px 0 0;padding:8px 20px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:slideU .22s ease}
@media (min-width:900px){.sheet{left:auto;right:20px;top:72px;bottom:auto;transform:none;width:380px;border-radius:14px;animation:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 0 4px}
.sheet-head b{font-family:var(--f-display);font-size:16px;letter-spacing:.12em}
.row{display:grid;grid-template-columns:4.2em 1fr;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row > label,.row > span{font-size:13px;color:var(--muted)}
.fs-ctl{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px}
.fs-ctl .btn{min-height:36px;padding:0 10px;font-family:var(--f-display)}
.fs-val{min-width:2.4em;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
input[type="range"]{width:100%;accent-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;min-height:38px;border:0;background:transparent;font-size:14px}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;font-size:11.5px;color:var(--muted)}
.sw i{width:36px;height:36px;border-radius:50%;border:1px solid rgba(0,0,0,.18);display:block}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--accent)}
.sw[aria-pressed="true"]{color:var(--ink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.switch input{width:20px;height:20px;accent-color:var(--accent)}

/* 朗讀播放列 */
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--raised);border-top:1px solid var(--line);box-shadow:0 -10px 30px -18px rgba(0,0,0,.4);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));animation:slideU .22s ease}
.player-in{max-width:760px;margin-inline:auto}
.p-row{display:flex;align-items:center;gap:6px}
.p-play{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.p-play svg{width:24px;height:24px}
.p-status{flex:1;min-width:0;padding-inline:8px;line-height:1.35}
.p-status b{display:block;font-family:var(--f-display);font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-status span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.p-opts{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px;padding-top:10px;margin-top:10px;border-top:1px solid var(--line)}
.p-opts label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.p-opts select{width:100%}
.p-opts .vol{grid-column:1/-1}
.vol-ctl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;min-height:36px}
@media (max-width:560px){.p-opts{grid-template-columns:1fr 1fr}.p-opts .voice{grid-column:1/-1;order:-1}}
.p-hint{margin:8px 0 0;font-size:12px;color:var(--faint)}
.p-opts .pron-btn{grid-column:span 2;align-self:end;justify-self:start;min-height:36px}
/* 選取文字時浮在下方的「修正讀音」鈕；位置由程式依播放面板、進度列的高度調 */
.pron-chip{position:fixed;left:50%;transform:translateX(-50%);z-index:34;max-width:calc(100% - 32px);padding:10px 18px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:14px;box-shadow:var(--shadow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel textarea.pron-list{min-height:7.5em;font-size:14px}
.panel .seg button:disabled{opacity:.45}

/* 朗讀進度列：念的時候常駐在最下方，停了就收。左邊設定鈕、中間這一章的進度（拖到哪段就從哪段念）、右邊音量 */
:root{--ttsbar-h:calc(60px + env(safe-area-inset-bottom,0px))}
.ttsbar{--tx:0;position:fixed;left:0;right:0;bottom:0;z-index:32;height:var(--ttsbar-h);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--raised);border-top:1px solid var(--line);box-shadow:0 -10px 30px -18px rgba(0,0,0,.4);animation:slideU .22s ease}
.ttsbar-in{max-width:760px;margin-inline:auto;height:44px;display:flex;align-items:center;gap:8px}
.ttsbar input[type="range"]{margin:0;height:32px;min-width:0}
.ttsbar .seek{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.ttsbar .seek input{flex:1}
.ttsbar .pos{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ttsbar .vol{flex:none;display:flex;align-items:center;gap:4px;color:var(--muted)}
.ttsbar .vol svg{width:18px;height:18px}
.ttsbar .vol input{width:84px}
@media (max-width:400px){.ttsbar .vol input{width:60px}}
body.ttsbar-on .player{bottom:var(--ttsbar-h);padding-bottom:10px}
body.ttsbar-on .rmain{padding-bottom:calc(64px + var(--ttsbar-h))}
body.ttsbar-on #reader.with-player .rmain{padding-bottom:calc(230px + var(--ttsbar-h))}

/* 對話框、提示 */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:var(--scrim)}
.panel{width:min(100%,480px);max-height:calc(100% - 16px);overflow-y:auto;background:var(--raised);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 6px;font-family:var(--f-display);font-size:19px;font-weight:600;text-wrap:balance}
.panel .m-body{margin:6px 0 0;color:var(--muted);line-height:1.7}
.panel label{display:block;margin:14px 0 6px;font-size:13px;color:var(--muted)}
.panel input[type="text"],.panel input[type="password"],.panel textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:15px}
.panel textarea{min-height:min(42vh,340px);resize:vertical;line-height:1.6}
.panel .hint{margin:8px 0 0;font-size:12.5px;color:var(--faint);line-height:1.6}
.actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:20px}
.actions .left{margin-right:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;max-width:calc(100% - 32px);padding:11px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;box-shadow:var(--shadow);text-align:center}
body.player-open .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
body.ttsbar-on .toast{bottom:calc(24px + var(--ttsbar-h))}
body.ttsbar-on.player-open .toast{bottom:calc(150px + var(--ttsbar-h))}

@keyframes slideU{from{transform:translate(var(--tx,0),24px);opacity:0}}
@keyframes slideL{from{transform:translateX(-24px);opacity:0}}
.sheet{--tx:-50%}
@media (min-width:900px){.sheet{--tx:0}}
.player{--tx:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    for (const t of body) { cur.push(t); len += (t.raw || '').length; if (len >= 8000 && t.type !== 'heading') { out.push(cur); cur = []; len = 0; } }

  for (const t of tokens) {

    else if (cur) cur.toks.push(t);

  for (const t of pre) {
    if (t.type === 'space' || (t === h1 && level !== 1)) continue;

      const m = t.text.trim().match(AUTHOR_RE);
      if (m) { if (!meta.author) meta.author = stripMd(m[1]); continue; }
    }

function parseTxt(text, meta, isMd) {
  const chs = []; let cur = { title: null, paras: [] };
  for (const raw of text.split('\n')) {
    let s = raw.trim(); if (!s) continue;
    let isH = false;
    if (isMd) {
      const m = s.match(/^(#{1,6})\s+(.*)$/);
      if (m) {
        if (m[1].length === 1 && !meta.title && !chs.length && !cur.paras.length) { meta.title = stripMd(m[2]); continue; }
        s = stripMd(m[2]); isH = true;
      }
    }
    if (isH || isChapterLine(s)) { if (cur.title !== null || cur.paras.length) chs.push(cur); cur = { title: s, paras: [] }; }
    else cur.paras.push(isMd ? stripMd(s) : s);
  }
  if (cur.title !== null || cur.paras.length) chs.push(cur);
  if (chs.length > 1 && chs[0].title === null) {
    const p = chs[0].paras;
    if (p.length <= 3 && p.every(x => x.length < 40)) {
      p.forEach((x, i) => {
        const m = x.match(AUTHOR_RE);
        if (m) { if (!meta.author) meta.author = m[1].trim(); }
        else if (i === 0 && !meta.title) meta.title = x;
      });
      chs.shift();
    } else chs[0].title = '卷首';
  }
  let list = chs;
  if (chs.length === 1 && chs[0].title === null) {
    const paras = chs[0].paras;
    const total = paras.reduce((s, x) => s + x.length, 0);
    if (total < 12000) list = [{ title: meta.title || '全文', paras }];
    else {
      list = []; let buf = [], len = 0;
      for (const x of paras) { buf.push(x); len += x.length; if (len >= 8000) { list.push({ title: `第 ${list.length + 1} 節`, paras: buf }); buf = []; len = 0; } }
      if (buf.length) list.push({ title: `第 ${list.length + 1} 節`, paras: buf });
    }
  }
  return list.map(c => ({ title: c.title, render: () => `<h2>${esc(c.title)}</h2>` + c.paras.map(p => `<p>${esc(p)}</p>`).join('') }));
}

function sanitize(html) {
  if (window.DOMPurify && DOMPurify.sanitize) return DOMPurify.sanitize(html);
  const tpl = document.createElement('template'); tpl.innerHTML = html;
  tpl.content.querySelectorAll('script,iframe,object,embed,style,link,meta,form').forEach(n => n.remove());
  tpl.content.querySelectorAll('*').forEach(el => [...el.attributes].forEach(a => {
    if (/^on/i.test(a.name) || (/^(href|src)$/i.test(a.name) && /^\s*javascript:/i.test(a.value))) el.removeAttribute(a.name);
  }));
  return tpl.innerHTML;
}

// 書檔用書名當檔名（檔名不收的字元換成底線）；跟別本撞名就加 (2)、(3)…。規則要跟 ClaudeBot 的 Publish-Book.ps1 一致
const titleFile = (title, format, id, books) => {

function slotsOf(o) {

      if (i >= 0 && (out[i].at || 0) >= v.at) return;
      const x = { id, dev, name: v.name || (dev === 'legacy' ? '其他裝置（舊版）' : '其他裝置'), ch: v.ch, b: v.b, pct: v.pct, t: v.t, at: v.at };

/* ───────── 匯入 ───────── */
async function readFileText(f) {
  const buf = new Uint8Array(await f.arrayBuffer());
  if (buf[0] === 0xFF && buf[1] === 0xFE) return new TextDecoder('utf-16le').decode(buf);
  if (buf[0] === 0xFE && buf[1] === 0xFF) return new TextDecoder('utf-16be').decode(buf);
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch {}
  const cands = ['big5', 'gb18030'].map(enc => {
    try { const t = new TextDecoder(enc).decode(buf); return { t, bad: (t.match(/\uFFFD/g) || []).length }; } catch { return null; }
  }).filter(Boolean).sort((a, b) => a.bad - b.bad);
  return cands.length ? cands[0].t : new TextDecoder().decode(buf);
}
const fmtOf = (name, text) => /\.(txt|text)$/i.test(name) ? 'txt' : /\.(md|markdown)$/i.test(name) ? 'md' : (/^#{1,6}\s/m.test(text) ? 'md' : 'txt');
const baseName = n => n.replace(/\.[^.]+$/, '');
/* 標籤：每本最多 8 個、每個最多 20 字；接受逗號、頓號、分號分隔，也接受 [a, b] 這種寫法 */
function normTags(v) {
  const arr = Array.isArray(v) ? v : String(v ?? '').replace(/^\s*\[|\]\s*$/g, '').split(/[,，、;；]/);
  const out = [];
  for (let t of arr) {
    t = String(t).trim().replace(/^["']|["']$/g, '').trim().slice(0, 20);
    if (t && !out.includes(t)) out.push(t);
    if (out.length >= 8) break;
  }
  return out;
}
const bookTags = b => Array.isArray(b.tags) ? b.tags : [];
const NO_TAG = '__none';

async function importFiles(fileList) {
  if (!canWrite()) { toast('這個檢視沒有寫入權限'); return; }
  const files = [...fileList].filter(f => /\.(md|markdown|txt|text)$/i.test(f.name) || /^text\//.test(f.type));
  if (!files.length) { toast('只收 .md 或 .txt 檔'); return; }
  const items = [];
  for (const f of files) { const text = await readFileText(f); items.push({ name: f.name, text, format: fmtOf(f.name, text) }); }
  items.sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant', { numeric: true }));
  if (items.length > 1) {
    const c = await ask({
      title: `選了 ${items.length} 個檔案`,
      body: '要各自成為一本書，還是依檔名順序合併成一本？合併時每個檔案是一章。',
      buttons: [{ key: 'cancel', label: '取消' }, { key: 'sep', label: '各自成書' }, { key: 'merge', label: '合併成一本', kind: 'primary' }]
    });
    if (!c || c === 'cancel') return;
    if (c === 'merge') { const m = mergeItems(items); await addOne(m.text, 'md', m.title); return; }
  }
  for (const it of items) await addOne(it.text, it.format, baseName(it.name));
}
function mergeItems(items) {
  const names = items.map(i => baseName(i.name));
  let prefix = names[0];
  for (const n of names) { let k = 0; while (k < prefix.length && prefix[k] === n[k]) k++; prefix = prefix.slice(0, k); }
  prefix = prefix.replace(/[\s_\-—.·第0-9０-９]+$/, '').trim();
  const title = prefix.length >= 2 ? prefix : names[0] + ' 等';
  const parts = items.map(it => {
    let t = it.text.replace(/^﻿/, '').replace(/\r\n?/g, '\n').trim();
    if (it.format === 'txt') t = t.split('\n').map(l => l.trim()).filter(Boolean).join('\n\n');
    const lines = t.split('\n');
    const first = lines[0].trim();
    const hm = first.match(/^#{1,6}\s+(.*)$/);
    if (hm) lines[0] = '# ' + hm[1];
    else if (isChapterLine(first)) lines[0] = '# ' + first;
    else lines.unshift('# ' + baseName(it.name), '');
    return lines.join('\n');
  });
  return { title, text: `---\ntitle: ${title}\n---\n` + parts.join('\n\n') };
}

async function addOne(text, format, fallbackTitle, forcedTitle, forcedAuthor) {
  if (!canWrite()) { toast('這個檢視沒有寫入權限'); return; }
  if (!String(text).trim()) { toast('內容是空的'); return; }
  let parsed;
  try { parsed = parseBook(text, format); } catch (e) { toast('這份檔案解析失敗：' + e.message); return; }
  const meta = {
    title: String(forcedTitle || parsed.meta.title || fallbackTitle || '未命名').trim().slice(0, 120),
    author: String(forcedAuthor || parsed.meta.author || '').trim().slice(0, 80),
    format, chars: countChars(text), chapters: parsed.chapters.length
  };
  // 檔頭 tags: 遊戲, 日本史 → 書目的 tags；沒寫就不帶（取代舊版時保留原本的標籤）
  const tags = normTags(parsed.meta.tags ?? parsed.meta.tag);
  if (tags.length) meta.tags = tags;
  const dup = S.books.find(b => b.title === meta.title);
  let how = 'new';
  if (dup) {
    how = await ask({
      title: `書架上已經有《${meta.title}》`,
      body: '如果這是改版，可以取代舊檔，閱讀進度會保留；也可以另存成一本新的。',
      buttons: [{ key: 'cancel', label: '取消' }, { key: 'new', label: '另存一本' }, { key: 'replace', label: '取代舊版', kind: 'primary' }]
    });
    if (!how || how === 'cancel') return;
  }
  toast(`正在加入《${meta.title}》…`, 0);
  try {
    if (how === 'replace') { await S.backend.replace(dup, meta, text); toast(`已更新《${meta.title}》，進度保留`); }
    else { await S.backend.add(meta, text); toast(`已加入《${meta.title}》· ${meta.chapters} 章`); }
  } catch (e) { toast(errMsg(e), 5000); }
}

/* ───────── 修正讀音（閱讀時選取文字） ─────────
   開對話框時正在念就先暫停，關掉後從同一段接著念，改過的讀音馬上聽得到 */
function pausedWhile(open) {
  const was = T.playing; if (was) ttsPause();
  const resume = () => { if (was && R.view === 'reader') ttsStart(T.b); };
  open(resume);
  modalResolve = resume; // 取消、按 Esc、點外面關掉時也接著念
}
// 讀音字典改了（或括號設定改了）：之後念的都照新規則，正在念的從這一段重新排
function speechRulesChanged() {
  refreshPron();
  if (R.view === 'reader') R.spoken = R.blocks.map((_, k) => k).filter(k => blockText(k));
  T.s = 0; T.chunks = null;
  if (T.playing) { if (NATIVE) ttsStart(T.b); else restartSpeech(); }
}
const canPreview = () => NATIVE ? typeof NATIVE.preview === 'function' : !!synth;
function previewSay(text) {
  const t = speakable(text); if (!t) return;
  if (NATIVE) { try { NATIVE.preview(t, prefs.voice || '', prefs.rate, prefs.volume); } catch {} return; }
  if (!T.voices.length) loadVoices();
  synth.cancel();
  const u = new SpeechSynthesisUtterance(t), v = currentVoice();
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'zh-TW';

// 存一條讀音。say 是 null（或跟原文一樣）＝改回念原文；scope：'book' 這本書、'all' 所有書
async function savePron(word, say, scope) {
  if (say === word) say = null;
  const id = R.book && !R.book.builtin ? R.book.id : null, title = R.book ? R.book.title : '';
  if (!id) scope = 'all';
  const fmHas = id ? word in fmPron(id) : false;
  await GH.mutate('lib', lib => {
    const all = normPron(lib.pronounce);
    if (scope === 'all') { if (say == null) delete all[word]; else all[word] = say; }
    if (Object.keys(all).length) lib.pronounce = all; else delete lib.pronounce;
    const b = id && lib.books.find(x => x.id === id);
    if (b) {
      const d = normPron(b.pronounce);
      // 這本書的條目蓋過共用的：存成所有書時，只有 frontmatter 也寫了這個詞才要在這本書記一筆，不然 frontmatter 那條會蓋掉
      if (scope === 'all') { if (fmHas) d[word] = say == null ? word : say; else delete d[word]; }
      else if (say != null) d[word] = say;
      else if (fmHas || word in all) d[word] = word;
      else delete d[word];
      if (Object.keys(d).length) b.pronounce = d; else delete b.pronounce;
    }
    return lib;
  }, `讀音：「${word}」${say == null ? '念原文' : '念成「' + say + '」'}（${scope === 'all' ? '所有書' : '《' + title + '》'}）`);
}

async function ensureParsed(book) {

/* 進度：本機馬上記；GitHub 每存一次就是一個 commit，所以只在換章、回書架、離開頁面時存，
   同一章讀很久時最多每 3 分鐘補存一次 */
let posTimer = null, cloudTimer = null, pendingCloud = null, cloudBusy = false;
const CLOUD_IDLE_MS = 180000;
function schedulePos() { clearTimeout(posTimer); posTimer = setTimeout(savePos, 700); }
function savePos() {
  if (!R.book || !R.chapters.length) return;
  const b = T.playing ? T.b : currentBlock();
  const n = R.chapters.length;
  const p = { ch: R.ch, b, pct: Math.min(1, (R.ch + (R.blocks.length ? (b + 1) / R.blocks.length : 1)) / n), t: (R.chapters[R.ch] && R.chapters[R.ch].title) || '', at: Date.now() };
  LS.set('prog:' + R.book.id, p);
  if (R.book.builtin || !canWrite()) return;
  const saved = ownCloud(R.book.id);
  if (saved && saved.ch === p.ch && saved.b === p.b) { if (pendingCloud && pendingCloud.id === R.book.id) pendingCloud = null; return; }
  const chChanged = !saved || saved.ch !== p.ch;
  pendingCloud = { id: R.book.id, p };
  if (chChanged) { clearTimeout(cloudTimer); cloudTimer = setTimeout(flushCloud, 1500); }
  else if (!cloudTimer) cloudTimer = setTimeout(flushCloud, CLOUD_IDLE_MS);
}
async function flushCloud(keepalive) {
  clearTimeout(cloudTimer); cloudTimer = null;
  if (!pendingCloud || !canWrite()) return;
  if (cloudBusy) { cloudTimer = setTimeout(flushCloud, 1500); return; }
  const x = pendingCloud; pendingCloud = null; cloudBusy = true;
  try { await GH.saveProgress(x.id, x.p, keepalive === true); }
  catch { if (!pendingCloud) pendingCloud = x; cloudTimer = setTimeout(flushCloud, 30000); }
  finally { cloudBusy = false; }
}

/* 連線 */
const online = () => S.mode === 'gh' || S.mode === 'readonly';
async function connect(interactive) {
  const conf = ghConf();
  S.backend = GH; S.syncing = '';
  if (!conf.token) { S.mode = 'setup'; S.loaded = true; updateChip(); renderLibrary(); return false; }
  // 先把本機副本擺上書架，再去跟 GitHub 對
  const cached = S.books.length ? true : await GH.loadCache();
  S.mode = 'init'; S.loaded = cached; updateChip(); renderLibrary();
  try { const writable = await GH.init(conf); S.mode = writable ? 'gh' : 'readonly'; }
  catch (e) { S.mode = 'error'; S.err = errMsg(e); if (interactive) toast(S.err, 6000); }
  S.loaded = true; updateChip(); renderLibrary();
  if (online()) { lastRefresh = Date.now(); afterSync(); }
  return online();
}
// 跟 GitHub 對完書目後：補下載缺的／改版的書檔、清掉已下架的、把離線時讀的進度推上去
let syncRunning = false;
async function afterSync() {
  if (syncRunning) return; syncRunning = true;
  try {
    const books = S.books.slice(), keep = new Set(books.map(b => 'text:' + b.id));
    for (const k of await Store.keys()) if (String(k).startsWith('text:') && !keep.has(k)) await Store.del(k);
    const need = [];
    for (const b of books) { const c = await Store.get('text:' + b.id); if (!c || c.ver !== b.updatedAt) need.push(b); }
    for (let i = 0; i < need.length && online(); i++) {
      S.syncing = `下載 ${i + 1}/${need.length}`; updateChip();
      textCache.delete(need[i].id);
      try { await GH.text(need[i]); } catch {}
    }
    S.syncing = ''; updateChip();
    if (!canWrite()) return;
    const pend = {};
    for (const b of books) {
      const l = LS.get('prog:' + b.id, null), c = ownCloud(b.id);
      if (l && (!c || (l.at || 0) > (c.at || 0)) && (!c || l.ch !== c.ch || l.b !== c.b)) pend[b.id] = l;
    }
    for (const [id, p] of Object.entries(pend)) { try { await GH.saveProgress(id, p); } catch {} }
  } finally { syncRunning = false; S.syncing = ''; updateChip(); }
}

/* ───────── 朗讀（Web Speech API） ───────── */
const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
const T = { playing: false, b: 0, s: 0, chunks: null, gen: 0, utter: null, errs: 0, sleepTimer: null, sleepAt: 0, stopAtChEnd: false, wake: null, voices: [], tick: null, seeking: false };

/* 在 Android 的 K書吧 App 裡打開時（有 window.KBookNative），朗讀改由 App 的前景服務念：
   瀏覽器的 speechSynthesis 在 Android 背景會被停掉，App 的不會。網頁把整本書的段落送過去，
   App 念到哪一段用 window.KBookNativeEvent 回報，網頁照著換章、標示段落、存進度。 */
const NATIVE = (window.KBookNative && typeof window.KBookNative.start === 'function') ? window.KBookNative : null;
const canSpeak = () => !!(synth || NATIVE);

/* ───────── 版本與更新 ─────────
   書架最下面一行：網頁版本（WEB_VERSION）、在 App 裡再加 App 版本（KBookNative.version()）。
   - App：打開時最多每 12 小時問一次 GitHub Releases 最新的 tag（v1.5 這種），比現在裝的新就提示下載
   - 網頁：按「檢查更新」才抓線上的 index.html 比 WEB_VERSION（網址帶 ?ver=，sw.js 不會拿快取頂替） */
const APP_REPO = 'agan0617/KBookBarApp';
const appVersion = () => { try { return NATIVE && NATIVE.version ? String(NATIVE.version()) : ''; } catch { return ''; } };
function verNewer(a, b) { // a 比 b 新？逐段比數字：1.10 > 1.9、2026.09.24.2 > 2026.09.24
  const x = String(a).replace(/^v/i, '').split('.').map(n => parseInt(n, 10) || 0);
  const y = String(b).replace(/^v/i, '').split('.').map(n => parseInt(n, 10) || 0);
  for (let i = 0; i < Math.max(x.length, y.length); i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0);
  return false;
}
const UPD = { web: '', checking: false, checkedAt: 0 };
function renderVer() {
  const el = $('#verLine'); if (!el) return;
  const app = appVersion(), rel = NATIVE ? LS.get('appRel', null) : null;
  const parts = [`網頁 ${esc(WEB_VERSION)}`];
  if (NATIVE) parts.push(`App ${esc(app || '舊版')}`);
  let html = `<div>${parts.join(' · ')} · <button type="button" id="verCheck"${UPD.checking ? ' disabled' : ''}>${UPD.checking ? '檢查中…' : '檢查更新'}</button></div>`;
  if (UPD.web) html += `<div class="new">網頁有新版 ${esc(UPD.web)} · <button type="button" id="verReload">重新整理</button></div>`;
  if (rel && verNewer(rel.tag, app || '0')) html += `<div class="new">App 有新版 ${esc(rel.tag.replace(/^v/i, ''))} · <a href="${esc(rel.url)}" target="_blank" rel="noopener">下載</a></div>`;
  else if (UPD.checkedAt && !UPD.web) html += `<div>${NATIVE ? '網頁和 App 都是最新版' : '已經是最新版'}</div>`;
  el.innerHTML = html;
  $('#verCheck').onclick = () => checkUpdates(true);
  if ($('#verReload')) $('#verReload').onclick = () => location.reload();
}
async function checkAppRelease() {
  // 有書架 token 就帶上：沒帶的話同一個 IP 每小時只能問 60 次，公司、學校的網路常常早就被用完（403）
  const url = `https://api.github.com/repos/${APP_REPO}/releases/latest`, token = ghConf().token;
  const get = auth => fetch(url, { headers: Object.assign({ Accept: 'application/vnd.github+json' }, auth ? { Authorization: 'Bearer ' + token } : {}), cache: 'no-store' });
  let r = await get(!!token);
  if (r.status === 401 && token) r = await get(false); // token 過期了就不帶再試一次
  if (!r.ok) throw new Error('release ' + r.status);
  const j = await r.json();
  LS.set('appRel', { tag: j.tag_name || '', url: j.html_url || `https://github.com/${APP_REPO}/releases/latest`, at: Date.now() });
}
async function checkWeb() {
  const r = await fetch('index.html?ver=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('page ' + r.status);
  const m = /const WEB_VERSION = '([^']+)'/.exec(await r.text());
  UPD.web = m && verNewer(m[1], WEB_VERSION) ? m[1] : '';
}
async function checkUpdates(manual) {
  if (UPD.checking) return;
  if (!navigator.onLine) { if (manual) toast('沒有網路，連上再檢查'); return; }
  UPD.checking = true; renderVer();
  const jobs = [];
  if (manual) jobs.push(checkWeb());
  if (NATIVE) jobs.push(checkAppRelease());
  const res = await Promise.allSettled(jobs);
  UPD.checking = false;
  if (manual) {
    if (res.some(x => x.status === 'rejected')) toast('有一項沒檢查成功，等一下再試');
    else UPD.checkedAt = Date.now();
  }
  renderVer();
}

/* 朗讀時不念的段落：程式碼區塊，以及「參考資料」這類標題底下整節（一路到下一個同級或更高的標題）。
   念網址和程式碼沒人聽得懂。段落照樣留在清單裡、只是文字給空字串，段落編號才不會跟畫面錯開；
   網頁的 speakNext 遇到空段落直接跳過，App 那邊空段落只會念一個全形空白。 */
const SILENT_HEAD_RE = /^(參考資料|参考资料|参考資料|參考文獻|参考文献|引用資料|資料來源|资料来源|出處|出处|references?|bibliography|sources)\s*[:：]?$/i;
function silentFlags(blocks) {
  let skip = 0; // 正在跳過的那節的標題層級，0 = 沒在跳
  return blocks.map(el => {
    const h = /^H([1-6])$/.exec(el.tagName);
    if (h) {
      const lv = +h[1];
      if (skip && lv <= skip) skip = 0;
      if (!skip && SILENT_HEAD_RE.test(el.textContent.trim())) skip = lv;
      return skip > 0;
    }
    return skip > 0 || !!el.closest('pre');
  });
}
// 出處編號 [4]、[9][10]、[1, 3] 也不念；前面緊貼英數字的（slice[0]）或四位數以上的（[2019]）不算
const CITE_RE = /(?<![\w)\]])(?:\[\d{1,3}(?:\s*[,，、–-]\s*\d{1,3})*\])+/g;
/* 停頓：每一段開始前停多久（毫秒，1× 語速的基準）。換段停一下，標題（章名、### 小節名）前後停久一點、
   標題本身念慢一點，換章停最久，聽的人才分得出段落和標題。第一段（剛按播放、點段落開始念）不停 */
const isHead = el => !!el && /^H[1-6]$/.test(el.tagName);
// 只有符號的段落（「＊＊＊」「◇」這類場景分隔）：不念，後面那段停久一點
const isBreak = el => !!el && !/[\p{L}\p{N}]/u.test(el.textContent);
const PARA_GAP = 250, HEAD_GAP = 700, CH_GAP = 1500, HEAD_RATE = 0.85;
const preGaps = els => els.map((el, k) => k === 0 ? CH_GAP : Math.max(isHead(el) ? HEAD_GAP : PARA_GAP, isHead(els[k - 1]) || isBreak(els[k - 1]) ? HEAD_GAP : 0));
// 語速快時停頓跟著縮短，但縮得比語速慢（4× 時停一半）
const gapMs = ms => Math.round(ms / Math.sqrt(Math.max(1, prefs.rate)));

/* 符號與數字整理成念得出來的樣子（只影響朗讀，畫面不變） */
const CJK = '\\u3400-\\u9fff\\uf900-\\ufaff';
const ROMAN = { II: '二', III: '三', IV: '四', VI: '六', VII: '七', VIII: '八', IX: '九' };
const ROMAN_U = 'ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ', ROMAN_ZH = '一二三四五六七八九十';
const SPK = {
  parenAll: /[（(][^（）()]*[)）]/g,
  // 中文後面括號裡只有英文的注解，例如「伺服器（server）」
  gloss: new RegExp(`(?<=[${CJK}])\\s*[（(]\\s*[A-Za-z][A-Za-z0-9 .,'’&/+\\-]*[)）]`, 'g'),
  range: /(\d)\s*[–—~～]\s*(?=\d)/g,          // 3～5 → 3到5
  times: /(\d)\s*[×✕xX]\s*(?=\d)/g,           // 3×4 → 3乘4
  fold: /(\d)\s*[×✕xX](?![A-Za-z0-9])/g,      // 2.5× → 2.5倍
  roman: /(?<![A-Za-z])(VIII|VII|III|IX|IV|VI|II)(?![A-Za-z])/g,
  romanU: /[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]/g,
  dash: /[—―─]+|…+|\.{3,}|\s\|\s/g,          // 破折號、刪節號 → 停一下
  slashL: new RegExp(`(?<=[${CJK}])\\s*[/／]\\s*`, 'g'),
  slashR: new RegExp(`\\s*[/／]\\s*(?=[${CJK}])`, 'g'),
  tilde: /[~～]/g,
  // 對話前後留個空：他說「……」他笑了 → 他說，「……」，他笑了
  qOpen: new RegExp(`(?<=[${CJK}A-Za-z0-9])([「『])`, 'g'),
  qClose: new RegExp(`([」』])(?=[${CJK}A-Za-z0-9])`, 'g'),
  dupComma: /[，,]\s*(?=[，。！？、；：])/g
};
function speakable(s) {
  if (!s) return s;
  const paren = prefs.paren || 'gloss';
  if (paren === 'skip') s = s.replace(SPK.parenAll, '');
  else if (paren === 'gloss') s = s.replace(SPK.gloss, '');
  return s.replace(SPK.range, '$1到').replace(SPK.times, '$1乘').replace(SPK.fold, '$1倍')
    .replace(SPK.roman, m => ROMAN[m]).replace(SPK.romanU, c => ROMAN_ZH[ROMAN_U.indexOf(c)])
    .replace(SPK.dash, '，').replace(SPK.slashL, '、').replace(SPK.slashR, '、').replace(SPK.tilde, '')
    .replace(SPK.qOpen, '，$1').replace(SPK.qClose, '$1，').replace(SPK.dupComma, '')
    .replace(/^[，\s]+/, '').replace(/\s+/g, ' ').trim();
}
// 念出來的文字：去掉網址、出處編號 → 讀音字典 → 符號整理
const rawText = el => el.textContent.replace(/https?:\/\/\S+/g, ' ').replace(CITE_RE, '').replace(/\s+/g, ' ').trim();
const speechText = (el, silent) => silent || isBreak(el) ? '' : speakable(R.pron ? R.pron(rawText(el)) : rawText(el));

function chapterBlocks(c) {
  if (!c.html) { try { c.html = sanitize(c.render()); } catch { c.html = ''; } }
  const tpl = document.createElement('template'); tpl.innerHTML = c.html;
  // 跟 openChapter 取 R.blocks 的規則一致，段落編號才對得上
  const blocks = [...tpl.content.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,pre,blockquote,tr')]
    .filter(el => !el.querySelector('p,li,pre,tr,h1,h2,h3,h4,h5,h6'));
  const silent = silentFlags(blocks);
  return {
    blocks: blocks.map((el, k) => speechText(el, silent[k])),
    heads: blocks.map((el, k) => isHead(el) ? k : -1).filter(k => k >= 0),
    pre: preGaps(blocks) // App 1.5 起照這個在段落前插靜音（1× 的毫秒數，App 自己依語速縮）
  };
}
function nativeSleepArg() {
  if (T.stopAtChEnd) return 'ch';
  return T.sleepAt ? String(Math.max(1, Math.round((T.sleepAt - Date.now()) / 60000))) : '0';
}
function nativeStart(b) {
  NATIVE.start(JSON.stringify({
    bookId: R.book.id, bookTitle: R.book.title,
    chapters: R.chapters.map(c => Object.assign({ title: c.title }, chapterBlocks(c))),
    ch: R.ch, b: Math.max(0, b), rate: prefs.rate, volume: prefs.volume, voice: prefs.voice || '', sleep: nativeSleepArg()
  }));
}
function nativeState() { try { return JSON.parse(NATIVE.getState()); } catch { return { active: false, playing: false }; } }
window.KBookNativeEvent = e => {
  if (!e || !NATIVE) return;
  if (e.type === 'voices') { loadVoices(); return; }
  if (e.type === 'error') toast(e.message || '朗讀出錯', 5000);
  if (!R.book || e.bookId !== R.book.id || R.view !== 'reader') return;
  T.playing = !!e.playing;
  if (!T.sleepTimer) { T.sleepAt = e.sleepAt || 0; T.stopAtChEnd = !!e.stopAtChEnd; }
  if (typeof e.ch === 'number' && R.chapters[e.ch]) {
    if (e.ch !== R.ch) openChapter(e.ch, { block: e.b });
    T.b = e.b;
    if (T.playing) markSpeaking(e.b);
    schedulePos();
  }
  if (e.type === 'end') { clearSpeaking(); toast('全書念完了'); }
  if (e.type === 'sleep') { T.sleepAt = 0; T.stopAtChEnd = false; $('#sleepSel').value = '0'; toast('時間到，已停止朗讀'); }
  updatePlayer();
};

function blockText(i) { const el = R.blocks[i]; return el ? speechText(el, R.silent && R.silent[i]) : ''; }
function chunksOf(text) {
  if (!text) return [];
  const sentences = text.match(/[^。！？!?；;…]+[。！？!?；;…]*[」』”’"'）)]*|[。！？!?；;…]+/g) || [text];
  const out = []; let buf = '';
  const push = s => {
    while (s.length > 200) {
      const cut = Math.max(s.lastIndexOf('，', 160), s.lastIndexOf(',', 160), s.lastIndexOf('、', 160));
      const k = cut > 40 ? cut + 1 : 160; out.push(s.slice(0, k)); s = s.slice(k);
    }
    if (s) out.push(s);
  };
  for (let s of sentences) {
    s = s.trim(); if (!s) continue;
    if (buf && (buf + s).length > 140) { push(buf); buf = s; } else buf += s;
  }
  if (buf) push(buf);
  return out;
}
function loadVoices() {
  if (NATIVE) {
    let list = []; try { list = JSON.parse(NATIVE.getVoices()) || []; } catch {}
    const sel = $('#voiceSel');
    const opt = v => `<option value="${esc(v.id)}">${esc(v.label)}</option>`;
    // 依語系分組，日文排在台灣國語後面（不然要捲過二十幾個中文聲音才看得到）
    const GROUPS = ['中文（台灣）', '日文', '中文（中國）', '粵語', '其他中文'];
    const groupOf = v => {
      const l = String(v.lang || '').toLowerCase();
      if (l.startsWith('ja')) return '日文';
      if (l.startsWith('yue') || /-hk\b/.test(l)) return '粵語';
      if (/-tw\b|hant/.test(l)) return '中文（台灣）';
      if (/-cn\b|hans/.test(l)) return '中文（中國）';
      return '其他中文';
    };
    sel.innerHTML = '<option value="">手機預設語音</option>' + GROUPS.map(g => {
      const vs = list.filter(v => groupOf(v) === g);
      return vs.length ? `<optgroup label="${esc(g)}">${vs.map(opt).join('')}</optgroup>` : '';
    }).join('');
    sel.value = list.some(v => v.id === prefs.voice) ? prefs.voice : '';
    // 清單裡沒有日文：說明是 App 太舊還是手機的語音引擎沒有日文
    const note = $('#voiceNote');
    if (list.some(v => groupOf(v) === '日文')) note.hidden = true;
    else {
      const ver = appVersion();
      let eng = ''; try { eng = JSON.parse(NATIVE.engine ? NATIVE.engine() : '{}').engine || ''; } catch {}
      note.textContent = (!ver || verNewer('1.2', ver))
        ? `沒有日文語音：目前的 App 是 ${ver || '舊'} 版，請安裝 K書吧 1.2 以上。`
        : `沒有日文語音：這支手機的語音引擎（${eng || '未知'}）沒有提供日文。請到 Play 商店安裝或更新「Google 語音服務」，再到「設定 → 其他設定 → 語言與輸入法 → 文字轉語音輸出」把偏好的引擎設成 Google。`;
      // 1.2 以上但清單還是空的＝語音引擎還沒準備好，等 voices 事件再來判斷
      note.hidden = !list.length && ver >= '1.2';
    }
    return;
  }
  if (!synth) return;
  T.voices = synth.getVoices();
  const zhRank = v => /zh[-_]TW|Taiwan/i.test(v.lang + v.name) ? 0 : /zh[-_]HK|Hong Kong/i.test(v.lang + v.name) ? 1 : 2;
  const zh = T.voices.filter(v => /^(zh|cmn|yue)/i.test(v.lang)).sort((a, b) => zhRank(a) - zhRank(b) || a.name.localeCompare(b.name));
  const other = T.voices.filter(v => !/^(zh|cmn|yue)/i.test(v.lang));
  const opt = v => `<option value="${esc(v.voiceURI)}">${esc(v.name.replace(/^Microsoft\s+|\s*-\s*Chinese.*$/g, '') + '（' + v.lang + '）')}</option>`;
  const sel = $('#voiceSel');
  sel.innerHTML = (zh.length ? `<optgroup label="中文">${zh.map(opt).join('')}</optgroup>` : '') + (other.length ? `<optgroup label="其他語言">${other.map(opt).join('')}</optgroup>` : '') || '<option value="">（瀏覽器預設）</option>';
  const v = currentVoice(); if (v) sel.value = v.voiceURI;
}
function currentVoice() {
  const vs = T.voices; if (!vs.length) return null;
  return vs.find(v => v.voiceURI === prefs.voice)
    || vs.find(v => /zh[-_]TW/i.test(v.lang) && /natural|online/i.test(v.name))
    || vs.find(v => /zh[-_]TW/i.test(v.lang))
    || vs.find(v => /^zh/i.test(v.lang)) || null;
}
function showPlayer() {
  $('#player').hidden = false; $('#reader').classList.add('with-player'); document.body.classList.add('player-open');
}
function showPlayerSettings() {
  showPlayer();
  if (NATIVE || !T.voices.length) loadVoices();
  $('#pOpts').hidden = false; $('#pTune').setAttribute('aria-expanded', 'true');
  if (!T.playing) { T.b = currentBlock(); T.s = 0; T.chunks = null; }
  updatePlayer();
}
// 耳機鈕：只開始／停止朗讀，不叫出面板（2026-09-23 Ken 指定）。面板與設定走下方進度列左邊的設定鈕。
function ttsQuickToggle() {
  if (!canSpeak()) { toast('這個瀏覽器不支援朗讀'); return; }
  if (T.playing) { ttsPause(); clearSpeaking(); return; }
  if (NATIVE || !T.voices.length) loadVoices();
  if (!T.sleepAt && !T.stopAtChEnd && prefs.sleep && prefs.sleep !== '0') setSleep(prefs.sleep);
  ttsStart(currentBlock());
}
function openPlayer() {
  if (!canSpeak()) { toast('這個瀏覽器不支援朗讀'); return; }
  showPlayer();
  if (NATIVE || !T.voices.length) loadVoices();
  if (!T.sleepAt && !T.stopAtChEnd && prefs.sleep && prefs.sleep !== '0') setSleep(prefs.sleep);
  if (!T.playing) ttsStart(currentBlock());
}
function ttsStart(b) {
  if (NATIVE) { T.b = Math.max(0, b); T.playing = true; nativeStart(b); updatePlayer(); return; }
  T.b = Math.max(0, b); T.s = 0; T.chunks = null; T.playing = true; T.errs = 0;
  acquireWake(); keepAlive(true); restartSpeech(); updatePlayer();
}
function restartSpeech() {
  const g = ++T.gen;
  synth.cancel();
  setTimeout(() => { if (g === T.gen && T.playing) speakNext(g); }, 90);
}
function speakNext(g, cont) {
  if (g !== T.gen || !T.playing) return;
  for (;;) {
    if (T.b >= R.blocks.length) {
      if (T.stopAtChEnd) { setSleep('0'); ttsPause(); toast('這一章念完了，已停止'); return; }
      if (R.ch < R.chapters.length - 1) { openChapter(R.ch + 1, { block: 0 }); T.b = 0; T.s = 0; T.chunks = null; continue; }
      ttsPause(); clearSpeaking(); toast('全書念完了'); return;
    }
    if (!T.chunks) T.chunks = chunksOf(blockText(T.b));
    if (T.s < T.chunks.length) break;
    T.b++; T.s = 0; T.chunks = null;
  }
  markSpeaking(T.b);
  const head = isHead(R.blocks[T.b]);
  // 接著上一段念到新的一段：先停一下（換段、標題前後、換章長短不同；剛按播放的那段不停）
  const gap = cont && T.s === 0 ? gapMs((R.pre && R.pre[T.b]) || 0) : 0;
  if (gap > 0) { setTimeout(() => speakNext(g), gap); return; }
  const u = new SpeechSynthesisUtterance(T.chunks[T.s]);
  const v = currentVoice();
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'zh-TW';
  u.rate = prefs.rate * (head ? HEAD_RATE : 1); u.volume = prefs.volume; u.pitch = 1;
  u.onend = () => { if (g !== T.gen) return; T.errs = 0; T.s++; speakNext(g, true); };
  u.onerror = e => {
    if (g !== T.gen || e.error === 'interrupted' || e.error === 'canceled') return;
    if (++T.errs > 3) { ttsPause(); toast('朗讀出錯（' + e.error + '），換個語音試試', 5000); return; }
    T.s++; speakNext(g);
  };
  T.utter = u; synth.speak(u); updatePlayer(); schedulePos();
}
/* 背景保活：Android Chrome 在頁面退到背景時常把 speechSynthesis 停掉。朗讀時同時循環播一段
   無聲音訊，讓瀏覽器把這頁當成「正在播放媒體」，並用 Media Session 在通知欄／鎖定畫面放控制鈕。
   不保證每個版本都有效（語音本身仍是瀏覽器的 speechSynthesis）。 */
const KA = { audio: null };
function silentWavUrl() {
  const rate = 8000, n = rate; // 1 秒、8-bit 單聲道
  const buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
  str(36, 'data'); v.setUint32(40, n, true);
  for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function keepAlive(on) {
  try {
    if (on) {
      if (!KA.audio) { KA.audio = new Audio(silentWavUrl()); KA.audio.loop = true; KA.audio.setAttribute('playsinline', ''); }
      const p = KA.audio.play(); if (p && p.catch) p.catch(() => {});
    } else if (KA.audio) KA.audio.pause();
  } catch {}
  updateMediaSession();
}
function updateMediaSession() {
  if (NATIVE || !('mediaSession' in navigator)) return; // App 裡由原生的 MediaSession 管
  try {
    const ms = navigator.mediaSession;
    if (!R.book) { ms.metadata = null; ms.playbackState = 'none'; return; }
    ms.metadata = new MediaMetadata({ title: (R.chapters[R.ch] && R.chapters[R.ch].title) || '', artist: R.book.title, album: 'K書吧' });
    ms.playbackState = T.playing ? 'playing' : 'paused';
  } catch {}
}
function wireMediaSession() {
  if (NATIVE || !('mediaSession' in navigator)) return;
  const set = (a, fn) => { try { navigator.mediaSession.setActionHandler(a, fn); } catch {} };
  set('play', () => { if (!T.playing && R.view === 'reader') ttsToggle(); });
  set('pause', () => { if (T.playing) ttsPause(); });
  set('stop', () => ttsStop());
  set('nexttrack', () => ttsJump(1));
  set('previoustrack', () => ttsJump(-1));
}

function ttsPause() {
  if (NATIVE) { T.playing = false; NATIVE.pause(); updatePlayer(); return; }
  T.playing = false; T.gen++; if (synth) synth.cancel(); releaseWake(); keepAlive(false); updatePlayer();
}
function ttsToggle() {
  if (T.playing) { ttsPause(); return; }
  if (!T.sleepAt && !T.stopAtChEnd && prefs.sleep && prefs.sleep !== '0') setSleep(prefs.sleep);
  if (NATIVE) {
    // App 那邊還停在這本、這一章就接著念；換過章或換過書就從畫面上的段落重新開始
    const st = nativeState();
    if (st.active && st.bookId === R.book.id && st.ch === R.ch) { T.playing = true; NATIVE.resume(); updatePlayer(); }
    else ttsStart(currentBlock());
    return;
  }
  T.playing = true; T.errs = 0; acquireWake(); keepAlive(true); restartSpeech(); updatePlayer();
}
function ttsStop() {
  if (!canSpeak()) return;
  T.b = 0; T.s = 0; T.chunks = null;
  if (NATIVE) { setSleep('0'); NATIVE.stop(); T.playing = false; clearSpeaking(); hidePlayer(); updatePlayer(); return; }
  ttsPause(); clearSpeaking(); setSleep('0');
  hidePlayer();
}
// 只收起播放面板，朗讀照常；按進度列左邊的設定鈕再叫出來
function hidePlayer() {
  $('#player').hidden = true; $('#reader').classList.remove('with-player'); document.body.classList.remove('player-open');
}
// App 的朗讀服務手上是不是這本書（網頁重載過、或服務被系統收掉再起來時可能不是）；不是就整本重送，免得跳到別本書的段落
const nativeHasBook = () => { const st = nativeState(); return !!(st.active && R.book && st.bookId === R.book.id); };
function ttsJump(delta) {
  if (NATIVE) { if (nativeHasBook()) NATIVE.jump(delta); else ttsStart(T.b + delta); return; }
  T.b = Math.max(0, Math.min(R.blocks.length - 1, T.b + delta)); T.s = 0; T.chunks = null;
  if (T.playing) restartSpeech(); else { markSpeaking(T.b); updatePlayer(); }
}
// 進度列拖到哪一段就從那段念（只在這一章內）
function ttsSeek(b) {
  b = Math.max(0, Math.min(R.blocks.length - 1, b | 0));
  T.b = b; T.s = 0; T.chunks = null;
  if (NATIVE) { markSpeaking(b); if (nativeHasBook()) NATIVE.seek(R.ch, b); else nativeStart(b); updatePlayer(); return; }
  if (T.playing) restartSpeech(); else { markSpeaking(b); updatePlayer(); }
}
// 下方被播放面板、進度列佔掉的高度
function bottomInset() {
  return ($('#player').hidden ? 0 : $('#player').offsetHeight) + ($('#ttsBar').hidden ? 0 : $('#ttsBar').offsetHeight);
}
function markSpeaking(b) {
  const prev = $('#article .speaking'); if (prev) prev.classList.remove('speaking');
  const el = R.blocks[b]; if (!el) return;
  el.classList.add('speaking');
  const r = el.getBoundingClientRect();
  const bottomLimit = innerHeight - bottomInset() - 20;
  if (r.top < barH() + 10 || r.bottom > bottomLimit) {
    const y = r.top + scrollY - Math.max(barH() + 20, (bottomLimit - r.height) * 0.35);
    window.scrollTo({ top: Math.max(0, y), behavior: reduced ? 'auto' : 'smooth' });
  }
}
function clearSpeaking() { const prev = $('#article .speaking'); if (prev) prev.classList.remove('speaking'); }
function updatePlayer() {
  const btn = $('#pPlay');
  btn.innerHTML = T.playing ? I.pause : I.play;
  btn.setAttribute('aria-label', T.playing ? '暫停' : '播放');
  $('#btnTts').classList.toggle('on', T.playing);
  $('#btnTts').setAttribute('aria-label', T.playing ? '朗讀中，點一下停止' : '朗讀');
  updateMediaSession();
  $('#pTitle').textContent = (R.chapters[R.ch] && R.chapters[R.ch].title) || '';
  const sp = R.spoken || [];
  let k = sp.findIndex(i => i >= T.b); if (k < 0) k = sp.length - 1;
  let sub = sp.length ? `第 ${k + 1} / ${sp.length} 段` : '';
  if (T.sleepAt) { const m = Math.max(0, Math.ceil((T.sleepAt - Date.now()) / 60000)); sub += ` · ${m} 分鐘後停止`; }
  else if (T.stopAtChEnd) sub += ' · 念完這章停止';
  if (!T.playing) sub += ' · 已暫停';
  $('#pSub').textContent = sub;
  // 進度列：只在念的時候顯示；拖拉中不要把把手拉回去
  const on = T.playing && R.view === 'reader' && sp.length > 0;
  $('#ttsBar').hidden = !on; document.body.classList.toggle('ttsbar-on', on);
  if (on && !T.seeking) {
    const s = $('#seekRange');
    s.max = sp.length - 1; s.value = k;
    $('#seekPos').textContent = `${k + 1} / ${sp.length}`;
  }
}
function setSleep(v) {
  clearTimeout(T.sleepTimer); clearInterval(T.tick); T.sleepTimer = null; T.sleepAt = 0; T.stopAtChEnd = false;
  $('#sleepSel').value = v;
  if (v === 'ch') T.stopAtChEnd = true;
  else if (+v > 0) {
    T.sleepAt = Date.now() + (+v) * 60000;
    // App 裡由原生服務計時（網頁在背景時計時器靠不住），這裡只顯示倒數
    if (!NATIVE) T.sleepTimer = setTimeout(() => { setSleep('0'); ttsPause(); toast('時間到，已停止朗讀'); }, (+v) * 60000);
    T.tick = setInterval(updatePlayer, 30000);
  }
  if (NATIVE) NATIVE.setSleep(String(v));
  updatePlayer();
}
async function acquireWake() {
  try { if ('wakeLock' in navigator && !T.wake) { T.wake = await navigator.wakeLock.request('screen'); T.wake.addEventListener('release', () => { T.wake = null; }); } } catch {}
}
function releaseWake() { try { if (T.wake) T.wake.release(); } catch {} T.wake = null; }

/* ───────── 事件 ───────── */
function wire() {
  $('#btnBack').innerHTML = I.back; $('#btnToc').innerHTML = I.toc; $('#btnTts').innerHTML = I.phones;
  $('#btnTtsSet').innerHTML = I.tune; $('#volIcon').innerHTML = I.vol;
  $('#btnPrevCh').innerHTML = I.chPrev; $('#btnNextCh').innerHTML = I.chNext;
  $$('[data-close]').forEach(b => { b.innerHTML = I.close; b.addEventListener('click', closePanels); });
  $('#pPrev').innerHTML = I.prev; $('#pNext').innerHTML = I.next; $('#pPlay').innerHTML = I.play;
  $('#pTune').innerHTML = I.tune; $('#pClose').innerHTML = I.close;
  $('#sortSel').value = prefs.sort;
  $('#rateSel').value = String(prefs.rate);
  if (!canSpeak()) $('#btnTts').hidden = true;

  // 書架
  $('#btnImport').onclick = () => $('#fileInput').click();
  $('#fileInput').addEventListener('change', e => { const f = e.target.files; if (f && f.length) importFiles(f); e.target.value = ''; });
  $('#sortSel').onchange = e => { prefs.sort = e.target.value; savePrefs(); renderLibrary(); };
  $('#viewBtn').onclick = () => { prefs.view = prefs.view === 'list' ? 'grid' : 'list'; savePrefs(); renderLibrary(); };
  $('#syncChip').onclick = connectDialog;
  $('#library').addEventListener('click', e => {
    if (e.target.closest('[data-connect]')) { connectDialog(); return; }
    const tg = e.target.closest('[data-tag]');
    if (tg) { prefs.tag = tg.dataset.tag === prefs.tag ? '' : tg.dataset.tag; savePrefs(); renderLibrary(); return; }
    const ed = e.target.closest('[data-edit]');
    if (ed) { const b = S.books.find(x => x.id === ed.dataset.edit); if (b) editDialog(b); return; }
    if (e.target.closest('[data-slots]')) { slotsDialog(); return; }
    const op = e.target.closest('[data-open]');
    if (op) { openBook(op.dataset.open, null); return; }
    // 「繼續閱讀」卡片：照那一格的位置開
    const sl = e.target.closest('[data-slot]');
    if (sl) { const x = pickList[+sl.dataset.slot]; if (x) openBook(x.id, x); }
  });
  let dragDepth = 0;
  window.addEventListener('dragenter', e => { if (R.view !== 'library' || !canWrite() || !e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return; dragDepth++; $('#dropHint').hidden = false; });
  window.addEventListener('dragleave', () => { if (dragDepth > 0 && --dragDepth === 0) $('#dropHint').hidden = true; });
  window.addEventListener('dragover', e => { if (R.view === 'library' && canWrite()) e.preventDefault(); });
  window.addEventListener('drop', e => {
    if (R.view !== 'library' || !canWrite()) return;
    e.preventDefault(); dragDepth = 0; $('#dropHint').hidden = true;
    if (e.dataTransfer && e.dataTransfer.files.length) importFiles(e.dataTransfer.files);
  });

  // 閱讀
  $('#btnBack').onclick = () => { if (history.state && history.state.shuxia === 'reader') history.back(); else closeReader(); };
  window.addEventListener('popstate', () => { if (R.view === 'reader') closeReader(); });
  $('#btnToc').onclick = () => openPanel('#toc');
  $('#btnAa').onclick = () => { if ($('#aaSheet').hidden) openPanel('#aaSheet'); else closePanels(); };
  $('#btnTts').onclick = () => { if ($('#player').hidden) ttsQuickToggle(); else ttsToggle(); };
  // 進度列左邊的朗讀設定鈕：叫出播放面板並展開設定；已經開著就收起
  $('#btnTtsSet').onclick = () => { if (!$('#player').hidden && !$('#pOpts').hidden) hidePlayer(); else showPlayerSettings(); };
  // 進度列：拖的時候只更新數字，放開才跳段
  // 有些瀏覽器（Android Chrome）拖的過程就連發 change，每發一次就重排語音，引擎跟不上會把中途經過的段落念出來。
  // 所以手指還按著一律不跳段，放開後再等一下才跳；放開時位置沒變就只解除拖拉狀態
  const seek = $('#seekRange');
  let seekTimer = null, seekDown = false;
  const seekTo = () => {
    clearTimeout(seekTimer);
    seekTimer = setTimeout(() => {
      T.seeking = false;
      const sp = R.spoken || [], target = sp.length ? sp[Math.min(+seek.value, sp.length - 1)] : 0;
      if (target === T.b) updatePlayer(); else ttsSeek(target);
    }, 200);
  };
  seek.addEventListener('input', () => { T.seeking = true; clearTimeout(seekTimer); $('#seekPos').textContent = `${+seek.value + 1} / ${(R.spoken || []).length}`; });
  seek.addEventListener('change', () => { if (!seekDown) seekTo(); });
  seek.addEventListener('pointerdown', () => { seekDown = true; T.seeking = true; clearTimeout(seekTimer); });
  const seekUp = () => { if (!seekDown) return; seekDown = false; seekTo(); };
  window.addEventListener('pointerup', seekUp); window.addEventListener('pointercancel', seekUp);
  $('#scrim').onclick = closePanels;
  $('#btnPrev').onclick = $('#btnPrevCh').onclick = () => goChapter(R.ch - 1);
  $('#btnNext').onclick = $('#btnNextCh').onclick = () => goChapter(R.ch + 1);
  $('#tocList').addEventListener('click', e => { const b = e.target.closest('[data-ch]'); if (!b) return; closePanels(); goChapter(+b.dataset.ch); });
  $('#article').addEventListener('click', e => {
    if (e.target.closest('a')) return;
    const sel = window.getSelection && String(window.getSelection());
    if (sel) return;
    const blk = e.target.closest('[data-b]');
    // 點段落＝從那段開始念（面板收著也可以）：沒在念就順便叫出播放面板，正在念就只跳段
    if (blk && canSpeak()) {
      if ($('#player').hidden && !T.playing) {
        showPlayer();
        if (NATIVE || !T.voices.length) loadVoices();
        if (!T.sleepAt && !T.stopAtChEnd && prefs.sleep && prefs.sleep !== '0') setSleep(prefs.sleep);
      }
      ttsStart(+blk.dataset.b);
    }
  });
  window.addEventListener('scroll', onScroll, { passive: true });

  // 設定
  $('#fsRange').addEventListener('input', e => setFs(+e.target.value));
  $('#fsDown').onclick = () => setFs(prefs.fs - 1);
  $('#fsUp').onclick = () => setFs(prefs.fs + 1);
  $('#lhRange').addEventListener('input', e => setPref('lh', +(+e.target.value).toFixed(1)));
  $('#fontSeg').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) setPref('font', b.dataset.v); });
  $('#widthSeg').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) setPref('width', b.dataset.v); });
  $('#themeSw').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) setPref('theme', b.dataset.v); });
  $('#indentChk').addEventListener('change', e => setPref('indent', e.target.checked));

  // 朗讀
  $('#pPlay').onclick = ttsToggle;
  $('#pPrev').onclick = () => ttsJump(-1);
  $('#pNext').onclick = () => ttsJump(1);
  $('#pClose').onclick = hidePlayer;
  $('#pTune').onclick = () => { const o = $('#pOpts'); o.hidden = !o.hidden; $('#pTune').setAttribute('aria-expanded', String(!o.hidden)); };
  $('#rateSel').onchange = e => { prefs.rate = +e.target.value; savePrefs(); if (NATIVE) NATIVE.setRate(prefs.rate); else if (T.playing) restartSpeech(); };
  $('#voiceSel').onchange = e => { prefs.voice = e.target.value; savePrefs(); if (NATIVE) NATIVE.setVoice(prefs.voice); else if (T.playing) restartSpeech(); };
  $('#sleepSel').onchange = e => { prefs.sleep = e.target.value; savePrefs(); setSleep(e.target.value); };
  $('#parenSel').value = prefs.paren;
  $('#parenSel').onchange = e => { prefs.paren = e.target.value; savePrefs(); speechRulesChanged(); };
  $('#btnPron').onclick = pronListDialog;
  // 選取文字 →「修正讀音」。按下去時選取可能已經被清掉，所以用選取當下記住的字
  document.addEventListener('selectionchange', onSelChange);
  const chip = $('#pronChip');
  chip.addEventListener('pointerdown', e => e.preventDefault());
  chip.onclick = () => { const w = pronSel; chip.hidden = true; try { window.getSelection().removeAllRanges(); } catch {} if (w) pronDialog(w); };
  // 音量拉桿有兩支（播放面板的設定裡、下方進度列右邊），拉哪一支另一支都跟著動
  const vols = [$('#volRange'), $('#volRange2')];
  const showVol = () => { const v = Math.round(prefs.volume * 100); $('#volVal').textContent = v + '%'; vols.forEach(r => { if (+r.value !== v) r.value = v; }); };
  showVol();
  vols.forEach(r => {
    r.addEventListener('input', e => { prefs.volume = +e.target.value / 100; showVol(); });
    r.addEventListener('change', () => { savePrefs(); if (NATIVE) NATIVE.setVolume(prefs.volume); else if (T.playing) restartSpeech(); });
  });
  if (synth) { synth.cancel(); loadVoices(); if ('onvoiceschanged' in synth) synth.addEventListener('voiceschanged', loadVoices); }
  wireMediaSession();

  // 對話框
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

  // 鍵盤
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!$('#modal').hidden) { closeModal(); return; }
      if (panelOpen()) { closePanels(); return; }
      if (R.view === 'reader' && !$('#player').hidden) { hidePlayer(); return; }
      if (R.view === 'reader') { $('#btnBack').click(); }
      return;
    }
    if (R.view !== 'reader' || !$('#modal').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowLeft') { goChapter(R.ch - 1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { goChapter(R.ch + 1); e.preventDefault(); }
    else if (e.key === '+' || e.key === '=') setFs(prefs.fs + 1);
    else if (e.key === '-' || e.key === '_') setFs(prefs.fs - 1);
    else if (e.key === 'p' || e.key === 'P') { if ($('#player').hidden) ttsQuickToggle(); else ttsToggle(); }
    else if (e.key === 't' || e.key === 'T') { if ($('#toc').hidden) openPanel('#toc'); else closePanels(); }
  });

  // 離線讀完、網路回來：重新連上書架，把本機累積的進度推上去
  window.addEventListener('online', () => {
    if (S.mode === 'error' && ghConf().token && !cloudBusy) { lastRefresh = Date.now(); connect(false); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { savePos(); flushCloud(true); }
    else {
      if (NATIVE) { if (R.view === 'reader') window.KBookNativeEvent(Object.assign(nativeState(), { type: 'pos' })); }
      else if (T.playing) { acquireWake(); if (synth && !synth.speaking) restartSpeech(); }
      // 切回來時抓一次別台裝置的最新書架與進度
      if (Date.now() - lastRefresh > 30000 && !cloudBusy) {
        lastRefresh = Date.now();
        if (online()) GH.refresh().then(afterSync).catch(() => {});
        else if (S.mode === 'error' && ghConf().token) connect(false);
      }
      if (R.view === 'library' && $('#modal').hidden) renderLibrary();
    }
  });
  window.addEventListener('pagehide', () => { savePos(); flushCloud(true); });
}

/* ───────── 啟動 ───────── */
let lastRefresh = Date.now();
async function init() {
  wire(); applyPrefs(); renderLibrary(); renderVer();
  if (NATIVE && Date.now() - ((LS.get('appRel', null) || {}).at || 0) > 12 * 3600e3) checkUpdates(false);
  // 離線也打得開：Service Worker（sw.js）把頁面、marked／DOMPurify、字型存在裝置上；書檔本來就在 IndexedDB。
  // 有網路時 sw 仍一律抓最新頁面，抓不到才用存的那份
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  await connect(false);
  // 「上次閱讀 N 分鐘前」要跟著時間走
  setInterval(() => { if (R.view === 'library' && $('#modal').hidden && document.visibilityState === 'visible') renderLibrary(); }, 60000);
}
init();
})();
</script>
